<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catatan Transaksi Pulsa</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body{
      background:#f5f7fb;
    }

    .card{
      border:none;
      border-radius:16px;
      box-shadow:0 4px 15px rgba(0,0,0,0.08);
    }

    table{
      background:white;
    }

    th{
      background:#0d6efd !important;
      color:white;
    }
  </style>
</head>
<body>

<div class="container py-4">

  <div class="card p-4 mb-4">
    <h3 class="mb-4 text-primary">Catatan Transaksi Penjualan Pulsa</h3>

    <div class="row g-3">

      <div class="col-md-2">
        <input type="date" id="tanggal" class="form-control">
      </div>

      <div class="col-md-3">
        <input type="text" id="nama" class="form-control" placeholder="Nama Pelanggan">
      </div>

      <div class="col-md-3">
        <input type="text" id="nomor" class="form-control" placeholder="Nomor HP">
      </div>

      <div class="col-md-2">
        <input type="number" id="nominal" class="form-control" placeholder="Nominal">
      </div>

      <div class="col-md-2">
        <select id="status" class="form-select">
          <option value="Lunas">Lunas</option>
          <option value="Bon">Bon</option>
        </select>
      </div>

      <div class="col-md-12">
        <button class="btn btn-primary" onclick="simpanData()">
          Simpan Transaksi
        </button>
      </div>

    </div>
  </div>

  <div class="card p-4">

    <div class="d-flex justify-content-between align-items-right mb-3 flex-wrap gap-2">

  <h5 class="mb-0">Data Transaksi</h5>

  <button
    class="btn btn-success btn-sm"
    onclick="downloadExcel()">
    Download Excel
  </button>

      <input
    type="text"
    id="filterInput"
    class="form-control w-auto"
    placeholder="Filter semua data..."
    onkeyup="filterTable()"
  >
    </div>

    <div class="table-responsive">
      <table id="tableTransaksi" class="table table-bordered table-hover">
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>No HP</th>
            <th>Nominal</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="tbody">
        </tbody>

      </table>
      <div class="d-flex justify-content-center gap-2 mt-3">

  <button
  id="backBtn"
  class="btn btn-secondary"
  onclick="loadData('back')">
  Back
  </button>

  <button
  id="nextBtn"
  class="btn btn-primary"
  onclick="loadData('next')">
  Next
  </button>

</div>
    </div>

  </div>

</div>

<script>

  // =========================
  // KONFIGURASI FIREBASE
  // =========================

  const firebaseConfig = {
  apiKey: "AIzaSyBfrRLgIgF1OjXfFEZ6yc32J_Bp4jYPJe0",
  authDomain: "naila-cell.firebaseapp.com",
  projectId: "naila-cell",
  storageBucket: "naila-cell.firebasestorage.app",
  messagingSenderId: "246265926042",
  appId: "1:246265926042:web:906cb12b9c8db49939ea23"
};

  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();

  // =========================
  // SIMPAN DATA
  // =========================

  async function simpanData() {

  try {

    const tanggal = document.getElementById("tanggal").value;
    const nama = document.getElementById("nama").value;
    const nomor = document.getElementById("nomor").value;
    const nominal = document.getElementById("nominal").value;
    const status = document.getElementById("status").value;

    await db.collection("transaksi").add({
      tanggal: tanggal,
      nama: nama,
      nomor: nomor,
      nominal: nominal,
      status: status,
      createdAt: new Date()
    });

    //alert("Data berhasil disimpan!");

    loadData();

  } catch (error) {

    console.error(error);
    //alert("Gagal menyimpan data!");

  }

}

let firstVisible = null;
let lastVisible = null;
let currentPage = 1;

const pageStack = [];
  
  // =========================
  // LOAD DATA
  // =========================
function formatTanggal(tanggal){

  if(!tanggal) return "-";

  const parts = tanggal.split("-");

  return `${parts[2]}-${parts[1]}-${parts[0]}`;

}
async function loadData(direction = "first") {

  const tbody = document.getElementById("tbody");

  tbody.innerHTML = "";

  try {

    let query = db.collection("transaksi")
      .orderBy("tanggal", "desc")
      .limit(20);

    // NEXT
    if(direction === "next" && lastVisible){

      pageStack.push(firstVisible);

      query = db.collection("transaksi")
        .orderBy("tanggal", "desc")
        .startAfter(lastVisible)
        .limit(20);

      currentPage++;

    }

    // BACK
    if(direction === "back" && pageStack.length > 0){

      currentPage--;

      const prevFirst = pageStack.pop();

      query = db.collection("transaksi")
        .orderBy("tanggal", "desc")
        .startAt(prevFirst)
        .limit(20);

    }

    const snapshot = await query.get();
    // tombol next
document.getElementById("nextBtn").disabled =
  snapshot.docs.length < 20;

// tombol back
document.getElementById("backBtn").disabled =
  currentPage === 1;
    if(snapshot.empty){

     // alert("Tidak ada data");

      return;

    }

    firstVisible = snapshot.docs[0];
    lastVisible = snapshot.docs[snapshot.docs.length - 1];

    // nomor urut global
    let no = ((currentPage - 1) * 20) + 1;

    snapshot.forEach((doc) => {

      const data = doc.data();

      tbody.innerHTML += `
        <tr>

          <td>${no++}</td>

          <td>${formatTanggal(data.tanggal)}</td>

          <td>${data.nama || '-'}</td>

          <td>${data.nomor || '-'}</td>

          <td>
            Rp ${parseInt(data.nominal || 0).toLocaleString()}
          </td>

          <td>${data.status || '-'}</td>

          <td>

            ${
              data.status === "Bon"
              ?
              `
              <button
                class="btn btn-success btn-sm mb-1"
                onclick="validasiLunas('${doc.id}')">
                Lunas
              </button>
              `
              :
              ``
            }

            <button
              class="btn btn-danger btn-sm"
              onclick="hapusData('${doc.id}')">
              Hapus
            </button>

          </td>

        </tr>
      `;

    });

  } catch(error){

    console.error(error);

    alert("Gagal memuat data");

  }

}  
async function validasiLunas(id){

  try {

    await db.collection("transaksi").doc(id).update({
      status: "Lunas"
    });

    //alert("Status berhasil diubah menjadi Lunas");

    loadData();

  } catch(error){

    console.error(error);

    //alert("Gagal mengubah status");

  }

}
  // =========================
  // HAPUS DATA
  // =========================

  async function hapusData(id){

    const konfirmasi = confirm("Yakin ingin menghapus data?");

    if(!konfirmasi) return;

    await db.collection("transaksi").doc(id).delete();

    loadData();
  }
// =========================
// FILTER SEMUA DATA TABLE
// =========================

function filterTable(){

  const input = document.getElementById("filterInput");
  const filter = input.value.toLowerCase();

  const table = document.getElementById("tbody");
  const tr = table.getElementsByTagName("tr");

  for(let i = 0; i < tr.length; i++){

    const td = tr[i].getElementsByTagName("td");

    let cocok = false;

    for(let j = 0; j < td.length; j++){

      if(td[j]){

        const text = td[j].textContent || td[j].innerText;

        if(text.toLowerCase().indexOf(filter) > -1){
          cocok = true;
          break;
        }

      }

    }

    tr[i].style.display = cocok ? "" : "none";

  }

}
async function downloadExcel(){

  try {

    // ambil semua data dari firebase
    const snapshot = await db.collection("transaksi")
      .orderBy("tanggal", "desc")
      .get();

    let dataExcel = [];

    let no = 1;

    snapshot.forEach((doc) => {

      const data = doc.data();

      dataExcel.push({
        No: no++,
        Tanggal: formatTanggal(data.tanggal),
        Nama: data.nama || '-',
        "No HP": "'" + (data.nomor || '-'),
        Nominal: data.nominal || 0,
        Status: data.status || '-'
      });

    });

    // buat worksheet
    const worksheet = XLSX.utils.json_to_sheet(dataExcel);

    // buat workbook
    const workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      "Transaksi Pulsa"
    );

    // download file
    XLSX.writeFile(
      workbook,
      "data-transaksi-pulsa.xlsx"
    );

  } catch(error){

    console.error(error);

    alert("Gagal download excel");

  }

}
  loadData();

</script>

</body>
</html>
